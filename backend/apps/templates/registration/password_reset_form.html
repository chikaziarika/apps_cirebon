{% extends 'base.html' %}

{% block content %}
<section class="gsap-section d-flex justify-content-center align-items-center w-100" style="min-height: 100vh;">
    <div class="card shadow border-0" style="width: 100%;max-width: 450px;transform: translateY(-5rem);">
        <div class="card-body p-5 text-center">
            <div class="mb-4">
                <img src="/static/img/LogoSirigasi.png" alt="Logo SIRIGASI" style="height: 100px; width: auto; object-fit: contain;">
            </div>
            
            <h4 class="fw-bold mb-3">Lupa Password?</h4>
            <p class="text-muted small mb-4">
                Masukkan alamat email yang terdaftar. Kami akan mengirimkan instruksi untuk mengatur ulang password Anda.
            </p>
            
            <form method="post" class="text-start">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label small fw-bold">Alamat Email</label>
                    <input type="email" name="email" class="form-control" placeholder="contoh@email.com" required>
                    {{ form.email.errors }}
                </div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Kirim Link Reset</button>
            </form>
            
            <div class="mt-4">
                <a href="{% url 'login' %}" class="small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
